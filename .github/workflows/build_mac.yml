name: Build macOS Application
run-name: Build macOS Application by @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System and Python Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install PyQt6 websockets mss opencv-python-headless numpy pynput pyinstaller pillow

      - name: Build macOS Application Bundle & DMG
        run: |
          python3 build_mac.py

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overwatch-macOS
          path: |
            dist/Overwatch-macOS.dmg
            dist/Overwatch-macOS.zip
            dist/Overwatch.app
          if-no-files-found: warn
