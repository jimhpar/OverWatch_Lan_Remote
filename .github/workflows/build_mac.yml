name: Build macOS Application
run-name: Build macOS Application by @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System and Python Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install PyQt6 websockets mss opencv-python-headless numpy pynput pyinstaller pillow

      - name: Build macOS Application Bundle & DMG
        run: |
          python3 build_mac.py

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overwatch-macOS
          path: |
            dist/Overwatch-macOS.dmg
            dist/Overwatch-macOS.zip
            dist/Overwatch.app
          if-no-files-found: warn

      - name: Create Release and Upload Assets (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Overwatch-macOS.dmg
            dist/Overwatch-macOS.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
